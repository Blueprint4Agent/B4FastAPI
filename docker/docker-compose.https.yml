# Add to the base Compose file only after configuring the public domain and app.
services:
  app:
    environment:
      # The app port is loopback-only; only trusted services may join this network.
      FORWARDED_ALLOW_IPS: "*"
  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Export PUBLIC_DOMAIN with your public hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
