[project]
name = "blueprint4fastapi-backend"
version = "0.1.0"
description = "FastAPI auth template for agent-driven customization"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.10.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2,bcrypt]>=1.7.4",
    "redis[hiredis]>=5.0.0",
    "fakeredis>=2.23.0",
    "python-multipart>=0.0.26",
    "greenlet>=3.0.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest>=8.3.0",
    "httpx>=0.28.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
combine_as_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
pythonpath = ["."]
markers = [
    "api_test: router-level API contract tests with dependency overrides",
    "primary_data: integration tests with clean/primary test data state",
    "mocked_data: integration tests using seeded production-like dataset",
    "scenario_flow: sequential end-to-end-like domain scenario flows",
]
