name: Git governance
on:
    workflow_dispatch:
        inputs:
            pr_number:
                description: "Pull request number to validate"
                required: true
                type: string
permissions:
    contents: read
    pull-requests: read
concurrency:
    group: governance-manual-${{ inputs.pr_number }}
    cancel-in-progress: false
jobs:
    governance:
        name: Git governance
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: refs/pull/${{ inputs.pr_number }}/head
                  fetch-depth: 0
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Check actual PR metadata and authored commits
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ inputs.pr_number }}
              run: make git-governance-pr-check
