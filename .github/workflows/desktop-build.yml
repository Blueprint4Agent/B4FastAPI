name: Desktop Build

on:
    workflow_dispatch:
        inputs:
            api_base_url:
                description: "FastAPI origin embedded into the desktop build"
                required: false
                type: string
                default: ""
    schedule:
        # Scheduled main desktop build. GitHub cron is UTC; 16:00 UTC is 01:00 KST.
        - cron: "0 16 * * *"
    push:
        tags:
            - "v*"
    release:
        types:
            - published

permissions:
    contents: write

concurrency:
    group: desktop-build-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    resolve-release:
        name: Resolve desktop release metadata
        runs-on: ubuntu-latest
        outputs:
            release-name: ${{ steps.release.outputs.release-name }}
            tag-name: ${{ steps.release.outputs.tag-name }}
        steps:
            - name: Resolve release metadata
              id: release
              shell: bash
              run: |
                  if [[ "${{ github.event_name }}" == "release" ]]; then
                    tag_name="${{ github.event.release.tag_name }}"
                  elif [[ "${{ github.ref_type }}" == "tag" ]]; then
                    tag_name="${{ github.ref_name }}"
                  else
                    tag_name=""
                  fi

                  echo "tag-name=${tag_name}" >> "$GITHUB_OUTPUT"
                  if [[ -n "${tag_name}" ]]; then
                    echo "release-name=B4FastAPI ${tag_name}" >> "$GITHUB_OUTPUT"
                  else
                    echo "release-name=" >> "$GITHUB_OUTPUT"
                  fi

    desktop:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.platform }}
        needs:
            - resolve-release
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: macOS Apple Silicon
                      platform: macos-14
                      artifact-name: desktop-macos-aarch64
                      rust-target: aarch64-apple-darwin
                      args: --target aarch64-apple-darwin
                    - name: macOS Intel
                      platform: macos-13
                      artifact-name: desktop-macos-x64
                      rust-target: x86_64-apple-darwin
                      args: --target x86_64-apple-darwin
                    - name: Linux x64
                      platform: ubuntu-22.04
                      artifact-name: desktop-linux-x64
                      rust-target: ""
                      args: ""
                    - name: Windows x64
                      platform: windows-latest
                      artifact-name: desktop-windows-x64
                      rust-target: ""
                      args: ""

        env:
            VITE_API_BASE_URL: ${{ inputs.api_base_url || vars.DESKTOP_API_BASE_URL || 'http://localhost:8000' }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.resolve-release.outputs.tag-name || github.ref }}

            - name: Install Linux dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libappindicator3-dev \
                    librsvg2-dev \
                    patchelf \
                    xdg-utils

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: src/frontend/package-lock.json

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable

            - name: Install Rust target
              if: matrix.rust-target != ''
              run: rustup target add ${{ matrix.rust-target }}

            - name: Cache Rust build
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: src/frontend/src-tauri -> target

            - name: Install frontend dependencies
              working-directory: src/frontend
              run: npm ci

            - name: Build desktop app
              id: tauri
              uses: tauri-apps/tauri-action@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
              with:
                  projectPath: src/frontend
                  args: ${{ matrix.args }}
                  tagName: ${{ needs.resolve-release.outputs.tag-name }}
                  releaseName: ${{ needs.resolve-release.outputs.release-name }}

            - name: Upload desktop bundles
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.artifact-name }}
                  if-no-files-found: error
                  retention-days: 14
                  path: ${{ steps.tauri.outputs.artifactPaths }}
