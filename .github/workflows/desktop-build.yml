name: Desktop Build

on:
    workflow_dispatch:
        inputs:
            api_base_url:
                description: "FastAPI origin embedded into the desktop build"
                required: false
                type: string
                default: ""
    push:
        tags:
            - "v*"
    release:
        types:
            - published

permissions:
    contents: read

concurrency:
    group: desktop-build-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    desktop:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.platform }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: macOS Apple Silicon
                      platform: macos-14
                      artifact-name: desktop-macos-aarch64
                      rust-target: aarch64-apple-darwin
                      args: --target aarch64-apple-darwin
                    - name: macOS Intel
                      platform: macos-13
                      artifact-name: desktop-macos-x64
                      rust-target: x86_64-apple-darwin
                      args: --target x86_64-apple-darwin
                    - name: Linux x64
                      platform: ubuntu-22.04
                      artifact-name: desktop-linux-x64
                      rust-target: ""
                      args: ""
                    - name: Windows x64
                      platform: windows-latest
                      artifact-name: desktop-windows-x64
                      rust-target: ""
                      args: ""

        env:
            VITE_API_BASE_URL: ${{ inputs.api_base_url || vars.DESKTOP_API_BASE_URL || 'http://localhost:8000' }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Linux dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libappindicator3-dev \
                    librsvg2-dev \
                    patchelf \
                    xdg-utils

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: npm
                  cache-dependency-path: src/frontend/package-lock.json

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable

            - name: Install Rust target
              if: matrix.rust-target != ''
              run: rustup target add ${{ matrix.rust-target }}

            - name: Cache Rust build
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: src/frontend/src-tauri -> target

            - name: Install frontend dependencies
              working-directory: src/frontend
              run: npm ci

            - name: Build desktop app
              uses: tauri-apps/tauri-action@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
              with:
                  projectPath: src/frontend
                  args: ${{ matrix.args }}

            - name: Upload desktop bundles
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.artifact-name }}
                  if-no-files-found: error
                  path: |
                      src/frontend/src-tauri/target/release/bundle/**/*.AppImage
                      src/frontend/src-tauri/target/release/bundle/**/*.deb
                      src/frontend/src-tauri/target/release/bundle/**/*.dmg
                      src/frontend/src-tauri/target/release/bundle/**/*.exe
                      src/frontend/src-tauri/target/release/bundle/**/*.msi
                      src/frontend/src-tauri/target/release/bundle/**/*.rpm
