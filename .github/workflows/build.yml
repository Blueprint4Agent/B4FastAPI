name: Build

on:
    workflow_dispatch:
        inputs:
            ref:
                description: "Branch, tag, or commit SHA to build. Defaults to main when publishing an image."
                required: false
                type: string
            pr_number:
                description: "Pull request number to validate. Takes priority over ref and does not publish by default."
                required: false
                type: string
            publish_image:
                description: "Explicitly build and push the selected ref image to GitHub Container Registry"
                required: false
                type: boolean
                default: false

permissions:
    contents: read
    packages: write

concurrency:
    group: build-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.ref || '' }}
    cancel-in-progress: false

jobs:
    resolve-ref:
        name: Resolve build ref
        runs-on: ubuntu-latest
        outputs:
            checkout-ref: ${{ steps.request.outputs.checkout-ref }}
            image-version: ${{ steps.request.outputs.image-version }}
            build-image: ${{ steps.request.outputs.build-image }}
            publish-image: ${{ steps.request.outputs.publish-image }}
        steps:
            - name: Resolve manual build request
              id: request
              env:
                  REQUEST_REF: ${{ inputs.ref }}
                  REQUEST_PR: ${{ inputs.pr_number }}
                  PUBLISH: ${{ inputs.publish_image }}
              run: |
                  python3 - <<'PYTHON'
                  import os, re
                  pr = os.environ.get("REQUEST_PR", "")
                  ref = os.environ.get("REQUEST_REF", "")
                  publish = os.environ.get("PUBLISH") == "true"
                  if pr and not pr.isdecimal():
                      raise SystemExit("pr_number must be a positive integer")
                  if any(c in ref for c in "\r\n"):
                      raise SystemExit("ref must be a single line")
                  checkout = f"refs/pull/{pr}/head" if pr else ref or ("main" if publish else os.environ["GITHUB_REF"])
                  version = f"manual-pr-{pr}" if pr else "manual-" + re.sub(r"[^a-zA-Z0-9_.-]", "-", checkout)
                  with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                      output.write(f"checkout-ref={checkout}\nimage-version={version}\n")
                      output.write(f"build-image={str(publish).lower()}\npublish-image={str(publish).lower()}\n")
                  PYTHON

    backend:
        name: Backend checks
        runs-on: ubuntu-latest
        needs: [resolve-ref]
        env:
            VERIFY_BASE: HEAD
            VERIFY_HEAD: HEAD
            VERIFY_FULL: "1"
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.resolve-ref.outputs.checkout-ref }}
                  fetch-depth: 0
                  submodules: recursive
            - name: Plan verification
              id: scope
              run: python3 scripts/verification.py plan --github-output "$GITHUB_OUTPUT"
            - name: Verify scope harness
              run: make verification-test
            - name: Install uv
              if: steps.scope.outputs.backend == 'true'
              uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
                  cache-dependency-glob: src/backend/uv.lock
            - name: Set up Python
              if: steps.scope.outputs.backend == 'true'
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install backend dependencies
              if: steps.scope.outputs.backend == 'true'
              working-directory: src/backend
              run: uv sync --frozen
            - name: Run selected verification
              run: python3 scripts/verification.py run --domain backend

    frontend:
        name: Frontend checks
        runs-on: ubuntu-latest
        needs: [resolve-ref]
        env:
            VERIFY_BASE: HEAD
            VERIFY_HEAD: HEAD
            VERIFY_FULL: "1"
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.resolve-ref.outputs.checkout-ref }}
                  fetch-depth: 0
                  submodules: recursive
            - name: Plan verification
              id: scope
              run: python3 scripts/verification.py plan --github-output "$GITHUB_OUTPUT"
            - name: Verify scope harness
              run: make verification-test
            - name: Set up Node.js
              if: steps.scope.outputs.node == 'true'
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: src/frontend/package-lock.json
            - name: Install frontend dependencies
              if: steps.scope.outputs.node == 'true'
              run: make frontend-install
            - name: Install browser
              if: steps.scope.outputs.browser == 'true'
              working-directory: src/frontend
              run: npx playwright install --with-deps chromium
            - name: Run selected verification
              run: python3 scripts/verification.py run --domain frontend

    docker-image:
        name: Docker image
        runs-on: ubuntu-latest
        if: needs.resolve-ref.outputs.build-image == 'true'
        needs:
            - resolve-ref
            - backend
            - frontend
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.resolve-ref.outputs.checkout-ref }}
                  submodules: recursive

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Resolve image name
              id: image
              shell: bash
              run: |
                  image_name="ghcr.io/${{ github.repository }}"
                  echo "name=${image_name,,}" >> "$GITHUB_OUTPUT"

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ steps.image.outputs.name }}
                  tags: |
                      type=raw,value=${{ needs.resolve-ref.outputs.image-version }}
                      type=sha,format=short

            - name: Login to GitHub Container Registry
              if: needs.resolve-ref.outputs.publish-image == 'true'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/Dockerfile
                  push: ${{ needs.resolve-ref.outputs.publish-image == 'true' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
