name: Build

on:
    pull_request:
        branches:
            - main
        types:
            - opened
            - synchronize
            - reopened
    schedule:
        # Scheduled main image build. GitHub cron is UTC; 15:00 UTC is 00:00 KST.
        - cron: "0 15 * * *"
    workflow_dispatch:
        inputs:
            ref:
                description: "Branch, tag, or commit SHA to build. Defaults to main when publishing an image."
                required: false
                type: string
            pr_number:
                description: "Pull request number to validate. Takes priority over ref and does not publish by default."
                required: false
                type: string
            publish_image:
                description: "Explicitly build and push the selected ref image to GitHub Container Registry"
                required: false
                type: boolean
                default: false
    push:
        tags:
            - "v*"
    release:
        types:
            - published

permissions:
    contents: read
    packages: write

concurrency:
    group: build-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.ref || '' }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    resolve-ref:
        name: Resolve build ref
        runs-on: ubuntu-latest
        outputs:
            checkout-ref: ${{ steps.ref.outputs.checkout-ref }}
            image-version: ${{ steps.version.outputs.image-version }}
            build-image: ${{ steps.publish.outputs.build-image }}
            publish-image: ${{ steps.publish.outputs.publish-image }}
        steps:
            - name: Resolve checkout ref
              id: ref
              shell: bash
              run: |
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.pr_number }}" ]]; then
                    echo "checkout-ref=refs/pull/${{ inputs.pr_number }}/head" >> "$GITHUB_OUTPUT"
                  elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.ref }}" ]]; then
                    echo "checkout-ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
                  elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish_image }}" == "true" ]]; then
                    echo "checkout-ref=main" >> "$GITHUB_OUTPUT"
                  elif [[ "${{ github.event_name }}" == "release" ]]; then
                    echo "checkout-ref=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
                  elif [[ "${{ github.event_name }}" == "schedule" ]]; then
                    echo "checkout-ref=main" >> "$GITHUB_OUTPUT"
                  else
                    echo "checkout-ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
                  fi

            - name: Resolve image version
              id: version
              shell: bash
              run: |
                  if [[ "${{ github.event_name }}" == "release" ]]; then
                    echo "image-version=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
                  elif [[ "${{ github.ref_type }}" == "tag" ]]; then
                    echo "image-version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
                  elif [[ "${{ github.event_name }}" == "schedule" ]]; then
                    echo "image-version=nightly-main" >> "$GITHUB_OUTPUT"
                  elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.pr_number }}" ]]; then
                    echo "image-version=manual-pr-${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
                  elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish_image }}" == "true" && "${{ inputs.ref }}" == "main" ]]; then
                    echo "image-version=main" >> "$GITHUB_OUTPUT"
                  elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.ref }}" ]]; then
                    safe_ref="$(echo "${{ inputs.ref }}" | tr '/:@ ' '----' | tr -cd '[:alnum:]_.-')"
                    echo "image-version=manual-${safe_ref}" >> "$GITHUB_OUTPUT"
                  elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish_image }}" == "true" ]]; then
                    echo "image-version=main" >> "$GITHUB_OUTPUT"
                  else
                    echo "image-version=${{ github.sha }}" >> "$GITHUB_OUTPUT"
                  fi

            - name: Resolve image build and publish policy
              id: publish
              shell: bash
              run: |
                  if [[ "${{ github.event_name }}" == "release" || "${{ github.ref_type }}" == "tag" || "${{ github.event_name }}" == "schedule" ]]; then
                    echo "build-image=true" >> "$GITHUB_OUTPUT"
                    echo "publish-image=true" >> "$GITHUB_OUTPUT"
                  elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish_image }}" == "true" ]]; then
                    echo "build-image=true" >> "$GITHUB_OUTPUT"
                    echo "publish-image=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "build-image=false" >> "$GITHUB_OUTPUT"
                    echo "publish-image=false" >> "$GITHUB_OUTPUT"
                  fi

    backend:
        name: Backend checks
        runs-on: ubuntu-latest
        needs: [resolve-ref]
        env:
            VERIFY_BASE: ${{ github.event.pull_request.base.sha || 'HEAD' }}
            VERIFY_HEAD: HEAD
            VERIFY_FULL: ${{ github.event_name == 'pull_request' && '0' || '1' }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.resolve-ref.outputs.checkout-ref }}
                  fetch-depth: 0
                  submodules: recursive
            - name: Fetch previous frontend pin for classification
              if: github.event_name == 'pull_request'
              shell: bash
              run: |
                  old_pin=$(git rev-parse "$VERIFY_BASE:src/frontend")
                  if ! git -C src/frontend cat-file -e "$old_pin^{commit}"; then
                    git -C src/frontend fetch origin "$old_pin" || echo "Previous pin unavailable; planner will require full frontend checks."
                  fi
            - name: Plan verification
              id: scope
              run: python3 scripts/verification.py plan --github-output "$GITHUB_OUTPUT"
            - name: Verify scope harness
              run: make verification-test
            - name: Install uv
              if: steps.scope.outputs.backend == 'true'
              uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
                  cache-dependency-glob: src/backend/uv.lock
            - name: Set up Python
              if: steps.scope.outputs.backend == 'true'
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install backend dependencies
              if: steps.scope.outputs.backend == 'true'
              working-directory: src/backend
              run: uv sync --frozen
            - name: Run selected verification
              run: python3 scripts/verification.py run --domain backend

    frontend:
        name: Frontend checks
        runs-on: ubuntu-latest
        needs: [resolve-ref]
        env:
            VERIFY_BASE: ${{ github.event.pull_request.base.sha || 'HEAD' }}
            VERIFY_HEAD: HEAD
            VERIFY_FULL: ${{ github.event_name == 'pull_request' && '0' || '1' }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.resolve-ref.outputs.checkout-ref }}
                  fetch-depth: 0
                  submodules: recursive
            - name: Fetch previous frontend pin for classification
              if: github.event_name == 'pull_request'
              shell: bash
              run: |
                  old_pin=$(git rev-parse "$VERIFY_BASE:src/frontend")
                  if ! git -C src/frontend cat-file -e "$old_pin^{commit}"; then
                    git -C src/frontend fetch origin "$old_pin" || echo "Previous pin unavailable; planner will require full frontend checks."
                  fi
            - name: Plan verification
              id: scope
              run: python3 scripts/verification.py plan --github-output "$GITHUB_OUTPUT"
            - name: Verify scope harness
              run: make verification-test
            - name: Set up Node.js
              if: steps.scope.outputs.node == 'true'
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: src/frontend/package-lock.json
            - name: Install frontend dependencies
              if: steps.scope.outputs.node == 'true'
              run: make frontend-install
            - name: Install browser
              if: steps.scope.outputs.browser == 'true'
              working-directory: src/frontend
              run: npx playwright install --with-deps chromium
            - name: Run selected verification
              run: python3 scripts/verification.py run --domain frontend

    docker-image:
        name: Docker image
        runs-on: ubuntu-latest
        if: needs.resolve-ref.outputs.build-image == 'true'
        needs:
            - resolve-ref
            - backend
            - frontend
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.resolve-ref.outputs.checkout-ref }}
                  submodules: recursive

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Resolve image name
              id: image
              shell: bash
              run: |
                  image_name="ghcr.io/${{ github.repository }}"
                  echo "name=${image_name,,}" >> "$GITHUB_OUTPUT"

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ steps.image.outputs.name }}
                  tags: |
                      type=raw,value=${{ needs.resolve-ref.outputs.image-version }}
                      type=sha,format=short

            - name: Login to GitHub Container Registry
              if: needs.resolve-ref.outputs.publish-image == 'true'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/Dockerfile
                  push: ${{ needs.resolve-ref.outputs.publish-image == 'true' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
